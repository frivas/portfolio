# Releasing: git tag v1.2.3 && git push origin v1.2.3
# The tag's commit goes through the shared security gate, then the GitHub release
# gets the security tables, an SBOM section and the merged PRs in its notes, with
# the CycloneDX SBOM and every scan report attached.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: frivas/.github/.github/workflows/release.yml@v2
    with:
      tag: ${{ github.ref_name }}
      codeql-languages: '["javascript-typescript", "actions"]'
      gate: CI (html-validate, Stylelint, ESLint, tsc) passed on this commit.
